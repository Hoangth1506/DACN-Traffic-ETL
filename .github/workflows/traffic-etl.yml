# Automated 24/7 Traffic Pipeline - Verified Python 3.11 Build
name: Continuous 24/7 Realtime Traffic ETL & Dashboard Build

on:
  workflow_run:
    workflows: ['Traffic ETL Raw Collection']
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: traffic-etl-dashboard
  cancel-in-progress: true

jobs:
  run-etl-and-deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Sync latest main before generating artifacts
        run: git pull --ff-only origin main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ETL Data Generation
        run: |
          python generate_data.py

      - name: Export Public JSON Files
        run: |
          python export_json.py

      - name: Validate dashboard JSON artifacts
        run: |
          python scripts/validate_dashboard_json.py dashboard/public

      - name: Build Dashboard Dist
        run: |
          cd dashboard
          npm ci --legacy-peer-deps
          npm run build

      - name: Validate built dashboard JSON artifacts
        run: |
          python scripts/validate_dashboard_json.py dashboard/dist

      - name: Commit and Push Updated Dashboard Data to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f dashboard/public dashboard/dist

          if git diff --cached --quiet; then
            echo "No output changes to commit"
          else
            git commit -m "auto: update dashboard traffic data"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin main; then
                exit 0
              fi
              echo "Push attempt ${attempt} failed; retrying..."
              sleep $((attempt * 3))
            done
            echo "Unable to push dashboard artifacts after 3 attempts"
            exit 1
          fi
