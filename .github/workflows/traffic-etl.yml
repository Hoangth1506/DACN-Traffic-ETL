# Automated 24/7 Traffic Pipeline - Verified Python 3.11 Build
name: Continuous 24/7 Realtime Traffic ETL & Dashboard Build

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_run:
    workflows: ['Traffic ETL Raw Collection']
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-etl-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Real-Time Raw Measurement Collection
        env:
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
          TOMTOM_API_KEYS: ${{ secrets.TOMTOM_API_KEYS }}
        run: |
          python run_raw_measurement.py --measurement-label github_cron_live

      - name: Run ETL Data Generation
        run: |
          python generate_data.py

      - name: Export Public JSON Files
        run: |
          python export_json.py

      - name: Pull latest changes
        run: git pull --rebase --autostash origin main

      - name: Commit and Push Updated Data to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f outputs dashboard/public

          if git diff --cached --quiet; then
            echo "No output changes to commit"
          else
            git commit -m "auto: continuous real-time traffic data update [skip ci]"
            git push origin main
          fi
