name: Traffic ETL Raw Collection

on:
  workflow_dispatch:
    inputs:
      measurement_label:
        description: "Measurement label (de trong se tu dong dat ten)"
        required: false
        type: string
      measurement_date:
        description: "Vietnam measurement date, YYYY-MM-DD (de trong lay gio hien tai)"
        required: false
        type: string
      measurement_time:
        description: "Vietnam measurement time, HH:MM (de trong lay gio hien tai)"
        required: false
        type: string
  schedule:
    - cron: "*/2 * * * *"

concurrency:
  group: traffic-etl-raw-collection
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Collect raw TomTom and OSM data
        env:
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
          TOMTOM_API_KEYS: ${{ secrets.TOMTOM_API_KEYS }}
        run: |
          LABEL="${{ inputs.measurement_label }}"
          if [ -z "$LABEL" ]; then
            if [ "${{ github.event_name }}" = "schedule" ]; then
              LABEL="auto_cron"
            else
              LABEL="manual_dispatch"
            fi
          fi

          CMD="python run_raw_measurement.py --measurement-label \"$LABEL\""
          DATE="${{ inputs.measurement_date }}"
          TIME="${{ inputs.measurement_time }}"

          if [ -n "$DATE" ]; then
            CMD="$CMD --measurement-date \"$DATE\""
          fi

          if [ -n "$TIME" ]; then
            CMD="$CMD --measurement-time \"$TIME\""
          fi

          echo "Executing: $CMD"
          eval $CMD

      - name: Commit raw measurement outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main
          git add -f outputs/raw_measurements

          if git diff --cached --quiet; then
            echo "No output changes to commit"
          else
            git commit -m "Collect raw traffic measurement: ${{ inputs.measurement_label || 'auto_scheduled' }} [skip ci]"
            git push origin main
          fi
