name: Unified 24/7 Traffic ETL Pipeline

on:
  workflow_dispatch:
    inputs:
      measurement_label:
        description: "Measurement label (de trong se tu dong dat ten)"
        required: false
        type: string
      measurement_date:
        description: "Vietnam measurement date, YYYY-MM-DD (de trong lay gio hien tai)"
        required: false
        type: string
      measurement_time:
        description: "Vietnam measurement time, HH:MM (de trong lay gio hien tai)"
        required: false
        type: string
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: traffic-etl-pipeline
  cancel-in-progress: false

jobs:
  collect-etl-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Node Dependencies
        run: |
          cd dashboard
          npm ci --legacy-peer-deps

      - name: Cache OSM Data
        uses: actions/cache@v4
        with:
          path: .osm_cache
          key: osm-cache-${{ hashFiles('config/nodes.yaml') }}

      - name: Collect raw TomTom and OSM data
        env:
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
          TOMTOM_API_KEYS: ${{ secrets.TOMTOM_API_KEYS }}
        run: |
          LABEL="${{ inputs.measurement_label }}"
          if [ -z "$LABEL" ]; then
            if [ "${{ github.event_name }}" = "schedule" ]; then
              LABEL="auto_cron"
            else
              LABEL="manual_dispatch"
            fi
          fi

          CMD="python run_raw_measurement.py --measurement-label \"$LABEL\""
          DATE="${{ inputs.measurement_date }}"
          TIME="${{ inputs.measurement_time }}"

          if [ -n "$DATE" ]; then
            CMD="$CMD --measurement-date \"$DATE\""
          fi

          if [ -n "$TIME" ]; then
            CMD="$CMD --measurement-time \"$TIME\""
          fi

          echo "Executing: $CMD"
          eval $CMD

      - name: Run ETL Data Generation
        run: |
          python generate_data.py --limit 432

      - name: Export Public JSON Files
        run: |
          python export_json.py

      - name: Validate dashboard JSON artifacts
        run: |
          python scripts/validate_dashboard_json.py dashboard/public

      - name: Build Dashboard Dist
        run: |
          cd dashboard
          npm run build

      - name: Validate built dashboard JSON artifacts
        run: |
          python scripts/validate_dashboard_json.py dashboard/dist

      - name: Commit and Push All Data to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Configure merge strategy for auto-generated files
          git config merge.ours.driver "true"

          # Stage both raw data and dashboard outputs
          git add -f outputs/raw_measurements
          git add -f dashboard/public dashboard/dist

          if git diff --cached --quiet; then
            echo "No output changes to commit"
          else
            git commit -m "auto: unified etl & dashboard update [skip ci]"

            # Smart retry with exponential backoff and conflict resolution
            MAX_RETRIES=5
            for attempt in $(seq 1 $MAX_RETRIES); do
              echo "Push attempt ${attempt}/${MAX_RETRIES}..."

              # Pull with rebase and auto-resolve conflicts
              if git pull --rebase --autostash origin main; then
                echo "✓ Rebase successful"
              else
                echo "⚠ Rebase conflicts detected, resolving..."

                # Accept our version for JSON output files (always use latest)
                git checkout --ours -- outputs/*.json dashboard/public/*.json dashboard/dist/*.json 2>/dev/null || true

                # Accept their version for code files (prefer remote changes)
                git checkout --theirs -- "*.py" "*.js" "*.jsx" "*.ts" "*.tsx" "*.yml" "*.yaml" 2>/dev/null || true

                # Mark all conflicts as resolved
                git add -u

                # Continue rebase
                git rebase --continue || {
                  echo "⚠ Rebase continuation failed, aborting and retrying..."
                  git rebase --abort
                  sleep $((attempt * 3))
                  continue
                }
              fi

              # Try to push
              if git push origin main; then
                echo "✓ Successfully pushed on attempt ${attempt}"
                exit 0
              fi

              echo "✗ Push failed on attempt ${attempt}"

              # Exponential backoff: 3s, 6s, 9s, 12s, 15s
              if [ $attempt -lt $MAX_RETRIES ]; then
                SLEEP_TIME=$((attempt * 3))
                echo "Waiting ${SLEEP_TIME}s before retry..."
                sleep $SLEEP_TIME
              fi
            done

            echo "✗ Unable to push unified artifacts after ${MAX_RETRIES} attempts"
            exit 1
          fi
